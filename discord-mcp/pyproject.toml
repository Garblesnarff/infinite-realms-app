[project]
name = "infiniterealms-discord-mcp"
version = "1.0.0"
description = "Discord MCP server for InfiniteRealms alpha testing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "aiohttp>=3.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
