title = "Infinite Realms gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Documentation-only bearer token placeholders"
targetRules = ["curl-auth-header"]
condition = "AND"
regexTarget = "line"
regexes = [
  '''Authorization:\s*Bearer\s+(?:YOUR_TOKEN|YOUR_ANON_KEY|YOUR_USER_JWT|SERVICE_ROLE_KEY|USER_JWT)''',
]
paths = [
  '''^ai-adventure-scribe-main/docs/MIGRATION_GUIDE\.md$''',
  '''^ai-adventure-scribe-main/docs/SESSION_ARCHIVAL\.md$''',
  '''^ai-adventure-scribe-main/supabase/migrations/README_SESSION_ARCHIVAL\.md$''',
]

[allowlist]
description = "LLM replay fixtures (#734): the `key` field is the sha256 llmFetch writes, not a credential. Scoped to the fixture directory only."
paths = ['''^ai-adventure-scribe-main/server-bun/src/services/__tests__/fixtures/llm/''']
