name: Coverage

# Frontend coverage report, nightly and on demand (#2467). PR CI runs Vitest
# with coverage off (ai-adventure-scribe-main/vitest.config.ts,
# `coverage.enabled: false`): instrumenting the whole app made the frontend
# Vitest step several minutes slower for a report nobody gates on. This workflow
# runs the same suite with `--coverage` and uploads the HTML report as an
# artifact. No thresholds yet.
#
# Runs on the self-hosted runners like CI, for the same reason (private repo,
# metered minutes; see docs/ci-self-hosted-runner.md). It only runs the repo's
# own test suite, so it carries no extra risk over a CI run on main.
#
# `schedule` runs the default branch's copy of this file. To run it by hand:
#   gh workflow run coverage.yml
# The report is the `frontend-coverage` artifact on that run.

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: ai-adventure-scribe-main

jobs:
  coverage:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Same timeouts as the `frontend` job in ci.yml: the runner is CPU-capped,
      # and the suite is slower still with v8 instrumentation on.
      - run: bunx vitest run --coverage --testTimeout=20000 --hookTimeout=20000
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: ai-adventure-scribe-main/coverage/
          retention-days: 30
          if-no-files-found: error
