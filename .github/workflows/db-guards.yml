# Database schema guards.
#
# Deliberately a separate workflow from ci.yml, with `paths:` filters, so it
# runs only on pushes that actually touch the database layer -- a handful of
# pushes a month rather than every one.
#
# All jobs use GitHub-hosted ubuntu-latest runners.
#
# The same two checks also run locally: check-schema-drift.sh from the husky
# pre-commit hook whenever db/schema/*.ts is staged, and test-migrations.sh
# via `bun run test:migrations`. The hook is the primary enforcement point;
# this workflow is the backstop that cannot be skipped with --no-verify.

name: DB Guards

on:
  push:
    paths:
      - 'ai-adventure-scribe-main/db/schema/**'
      - 'ai-adventure-scribe-main/db/migrations/**'
      - 'ai-adventure-scribe-main/drizzle.config.ts'
      - 'ai-adventure-scribe-main/scripts/check-schema-drift.sh'
      - 'ai-adventure-scribe-main/scripts/test-migrations.sh'
      - '.github/workflows/db-guards.yml'
  pull_request:
    paths:
      - 'ai-adventure-scribe-main/db/schema/**'
      - 'ai-adventure-scribe-main/db/migrations/**'
      - 'ai-adventure-scribe-main/drizzle.config.ts'
      - 'ai-adventure-scribe-main/scripts/check-schema-drift.sh'
      - 'ai-adventure-scribe-main/scripts/test-migrations.sh'
      - '.github/workflows/db-guards.yml'

permissions: read-all

# One in-flight run per branch. A branch with an open PR fires both `push` and
# `pull_request`, and the duplicate would otherwise run beside the first.
# `ref_name` (bare branch name) is required for the two events to collapse into
# one group -- `ref` is fully qualified and would not.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ai-adventure-scribe-main

jobs:
  # Fails any commit that edits db/schema/*.ts without a matching migration in
  # db/migrations/. Three production incidents (20260710, and 20260725 twice
  # over) all came from that exact omission going unnoticed until a 500 in
  # production -- see 17ebfd47. Offline: no database, ~1 minute.
  schema-drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('ai-adventure-scribe-main/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Check schema.ts against migrations
        run: bash scripts/check-schema-drift.sh

  # Replays the migration history into a throwaway PostgreSQL database, so a
  # migration that cannot apply is caught here and not on the production box.
  #
  # The database is a `services:` container, CI-only and empty: it holds
  # nothing from production and lives for this job only. The image is
  # pgvector/pgvector:pg15 because production is PostgreSQL 15.8 (see
  # ai-adventure-scribe-main/CLAUDE.md) and the embedding migrations need
  # pgvector; on a stock postgres they are skipped, not tested. Host port 55432
  # is the one #1904's DB-safety guard allowlists, so the URL below is
  # unchanged from the previous workflow. The user, password and database are
  # CI-only dummies.
  migration-replay:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Replay migrations
        run: bash scripts/test-migrations.sh
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55432/postgres

# Phase 1 hosted-runner verification for source issue #2729.
