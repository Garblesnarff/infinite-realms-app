name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

defaults:
  run:
    working-directory: ai-adventure-scribe-main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install server-bun dependencies
        run: bun install
        working-directory: ai-adventure-scribe-main/server-bun

      - name: Build
        run: bun run build

      - name: Run tests (no new failures vs baseline)
        run: |
          bunx vitest run --reporter=json --outputFile=vitest-report.json || true
          node scripts/ci/check-vitest-baseline.mjs vitest-report.json
