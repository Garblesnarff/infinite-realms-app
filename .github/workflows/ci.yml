name: CI

# Runs on the self-hosted runner (hetzner-nbg1-prod) rather than GitHub-hosted
# minutes. This repo is private, so Actions minutes are metered and billed --
# ci.yml has already been disabled once after exhausting the monthly allowance
# (see db-guards.yml), and in August 2026 the whole account stopped running
# jobs mid-session with "recent account payments have failed".
#
# The runner is a systemd service on the production box under a dedicated
# unprivileged `ghrunner` user, capped at 4 of 8 cores and 6G, with a CPU
# weight far below the game server so a CI run yields to live traffic.
# See docs/ci-self-hosted-runner.md.
#
# The one exception is the `changes` job (path filters), which runs on
# `ubuntu-latest`: it takes about 10 seconds and every heavy job waits for it,
# so it must not queue behind self-hosted jobs.

# One run per commit: `pull_request` for branches, `push` for main only. A
# branch with an open PR used to fire both events on every commit; concurrency
# cancelled one, but the runner slots and the hosted `changes` job were still
# spent (#2467). A branch with no PR gets no CI until its PR is opened, and a
# PR with merge conflicts gets none either (`pull_request` needs a merge ref).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

# One in-flight run per branch. Pushing three times in a minute used to start
# three full matrices that all raced to finish; now the older ones are
# cancelled the moment a newer commit arrives. Runs queue on the self-hosted
# runners rather than running in parallel, so this matters more here than it
# did on GitHub's fleet.
#
# Keyed on the BRANCH NAME: `head_ref` is the PR's branch on `pull_request`, and
# `ref_name` is the branch on `push` (always `main` now).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ai-adventure-scribe-main

jobs:
  # Decides which of the heavy jobs a change needs (#2323). A job whose `if:` is
  # false is `skipped`, and a run whose jobs are all success-or-skipped
  # concludes `success`, so the merge gate that reads the run conclusion is
  # unaffected. `checks` does not depend on this job and always runs.
  #
  # On `pull_request` the action diffs against the PR's base and ignores
  # `base:`. On a push to main it falls back to the previous commit, which is
  # the squash commit's own diff.
  #
  # Every filter lists `.github/workflows/**`, so editing a workflow runs
  # everything. Globs are relative to the repository root.
  #
  # This is the one job on a GitHub-hosted runner, on purpose: it takes about
  # 10 seconds, and every heavy job waits for it, so on the self-hosted runners
  # it queued behind other runs' jobs (12 minutes in one burst, #2328). About
  # 10 hosted seconds per run is negligible against the free monthly allowance.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: main
          filters: |
            frontend:
              - '.github/workflows/**'
              - 'package.json'
              - 'bun.lock'
              - 'ai-adventure-scribe-main/src/**'
              - 'ai-adventure-scribe-main/shared/**'
              - 'ai-adventure-scribe-main/public/**'
              - 'ai-adventure-scribe-main/tailwind/**'
              - 'ai-adventure-scribe-main/tests/**'
              - 'ai-adventure-scribe-main/cli/**'
              - 'ai-adventure-scribe-main/scripts/check-client-build-secrets.mjs'
              - 'ai-adventure-scribe-main/package.json'
              - 'ai-adventure-scribe-main/bun.lock'
              - 'ai-adventure-scribe-main/bunfig.toml'
              - 'ai-adventure-scribe-main/index.html'
              - 'ai-adventure-scribe-main/components.json'
              - 'ai-adventure-scribe-main/eslint.config.js'
              - 'ai-adventure-scribe-main/postcss.config.js'
              - 'ai-adventure-scribe-main/vite.config.*'
              - 'ai-adventure-scribe-main/vitest.config.*'
              - 'ai-adventure-scribe-main/tailwind*'
              - 'ai-adventure-scribe-main/tsconfig*'
              # The client imports these server-bun files directly (dmResponseSchema,
              # the AppRouter type, the tactical contracts, initiative order and the
              # spell data), so a change there can break tsc, vitest or the build.
              - 'ai-adventure-scribe-main/server-bun/src/trpc/**'
              - 'ai-adventure-scribe-main/server-bun/src/tactical/**'
              - 'ai-adventure-scribe-main/server-bun/src/services/dm/**'
              - 'ai-adventure-scribe-main/server-bun/src/services/combat/initiative-order.ts'
              - 'ai-adventure-scribe-main/server-bun/src/data/spellData*'
            server:
              - '.github/workflows/**'
              - 'package.json'
              - 'bun.lock'
              - 'ai-adventure-scribe-main/server-bun/**'
              - 'ai-adventure-scribe-main/shared/**'
              - 'ai-adventure-scribe-main/db/**'
              - 'ai-adventure-scribe-main/supabase/**'
              - 'ai-adventure-scribe-main/scripts/server-typecheck-gate.sh'
              - 'ai-adventure-scribe-main/scripts/test-migrations.sh'
              - 'ai-adventure-scribe-main/package.json'
              - 'ai-adventure-scribe-main/bun.lock'
              - 'ai-adventure-scribe-main/bunfig.toml'
              - 'ai-adventure-scribe-main/drizzle.config.ts'
              # server-bun imports these client files directly (spellData.ts,
              # the voice routes and their tests).
              - 'ai-adventure-scribe-main/src/data/**'
              - 'ai-adventure-scribe-main/src/services/voice/voice-constants.ts'
              - 'ai-adventure-scribe-main/src/services/voice/voice-pools.ts'

  # Always runs, on every change. Folds what used to be three single-step jobs
  # (security-lint, server-typecheck, gitleaks) into one, so a run pays for one
  # checkout, one setup-bun and one install instead of three (#2323). Every step
  # after the first uses `!cancelled()` so a failing step does not hide the
  # others: the three jobs used to report independently. The steps that need
  # installed dependencies also require the install step to have succeeded, so
  # a failed install is one red step, not several.
  #
  # `bun run lint` is here, not in `frontend`: `eslint .` also lints
  # server-bun/, scripts/ and db/, which the path-filtered `frontend` job does
  # not run for a server-only change.
  #
  # `fetch-depth: 0` is for gitleaks, which scans the full history.
  # `pull-requests: write` is for gitleaks-action, which comments on the PR.
  checks:
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Every `*.real-db.test.ts` must be in the `server-real-db` job's explicit
      # file list below. That list stays a list (a whole-suite `bun test` with a
      # database configured fails 54 tests), which is exactly why adding a suite
      # to it is a step someone forgets -- and an unregistered suite runs nowhere
      # while `server-vitest` stays green (#1906, again in #2560). First step of
      # this job so it fails before anything expensive (#2574).
      - name: Real-DB test files must be registered in ci.yml
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-real-db-test-list.mjs
      # Repo-root AGENTS.md is a byte-identical copy of
      # ai-adventure-scribe-main/AGENTS.md (#2104/#2107). Fail here if they drift.
      # This lived in `frontend`, which is now skipped on a docs-only change --
      # exactly the change that edits AGENTS.md -- so it runs here instead.
      - name: AGENTS.md copies must match
        if: ${{ !cancelled() }}
        working-directory: .
        run: cmp -s AGENTS.md ai-adventure-scribe-main/AGENTS.md
      - if: ${{ !cancelled() }}
        run: node scripts/security-lint.js
      - name: Gitleaks scan
        if: ${{ !cancelled() }}
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
      - if: ${{ !cancelled() }}
        uses: oven-sh/setup-bun@v2
      - id: install
        if: ${{ !cancelled() }}
        run: bun install --frozen-lockfile
      - id: install-server
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun install --frozen-lockfile
        working-directory: ai-adventure-scribe-main/server-bun
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run lint
      # The guard above is only trustworthy if its comparison function is tested,
      # and scripts/ is outside every test glob (vitest includes src/**, tests/**
      # and cli/src/** only), so this file is run explicitly. Same reason
      # security-lint.test.ts has never run in CI -- see the T09 audit note.
      - name: Real-DB test list guard unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun test scripts/ci/check-real-db-test-list.test.ts
        working-directory: ai-adventure-scribe-main
      # Server typecheck gate (#2313). Runs tsc over the server program and
      # fails on any error in a file not quarantined in
      # server-bun/typecheck-known-errors.txt; a quarantined file with no errors
      # fails as a stale entry so the list gets cleaned up. A PR is red if this
      # step fails -- "pre-existing" is not an excuse once main is green.
      - name: Server typecheck gate
        if: ${{ !cancelled() && steps.install-server.outcome == 'success' }}
        run: bash scripts/server-typecheck-gate.sh
        working-directory: ai-adventure-scribe-main
      # lore-keeper-ingest has its own package-lock and node_modules, so the
      # workspace installs above do not provide its dependencies. Hosted CI ran
      # none of its tests before (#2419): #2368 and #2407 relied on local runs.
      - id: install-lore-keeper-ingest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm ci
        working-directory: ai-adventure-scribe-main/tools/lore-keeper-ingest
      - name: Lore keeper ingest tests
        if: ${{ !cancelled() && steps.install-lore-keeper-ingest.outcome == 'success' }}
        run: bun test tools/lore-keeper-ingest
        working-directory: ai-adventure-scribe-main

  frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      # The runner is deliberately CPU-capped (4 of 8 cores, CPUWeight 20) so a
      # test run cannot starve the game server, which makes this suite roughly
      # 2.4x slower than unconstrained. Three timing-sensitive tests flaked at
      # vitest's 5s default on the first self-hosted run; raising the ceiling is
      # the right trade against loosening the cap that protects production.
      - run: bunx vitest run --testTimeout=20000 --hookTimeout=20000
      - run: bun run build

  server-vitest:
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: ai-adventure-scribe-main/server-bun
      - run: bun run test
        working-directory: ai-adventure-scribe-main/server-bun
      # The job is named server-vitest but until now ran no Vitest at all. The
      # step above is `bun scripts/run-isolated-tests.ts`, whose glob is
      # `src/**/*.test.ts`; the 28 `src/**/*.vitest.ts` files import from
      # 'vitest', so `bun test` could not have run them even if the glob
      # matched. They were executed by nothing -- 250 tests, 8 of the files
      # security/authorization suites (T01, #1875).
      #
      # server-bun/vitest.config.ts already globs them correctly; only the
      # invocation was missing, so this is a new step rather than a config fix.
      # `vitest` itself is a devDependency of the ai-adventure-scribe-main
      # workspace, not of server-bun, and resolves through the ancestor
      # node_modules/.bin that the install two steps up populates.
      - run: bun run test:vitest
        working-directory: ai-adventure-scribe-main/server-bun

  # The real-database suites, which `server-vitest` above cannot run.
  #
  # `bun test` there has no DATABASE_URL, so `hasRealDb` in
  # server-bun/src/services/__tests__/fixtures/real-db.ts is false and every
  # `*.real-db.test.ts` block degrades to `describe.skip` -- silently, on every
  # run since they were written (#1906). A green server-vitest badge has been
  # overstating what was tested: #1904's DB-safety guard, the combat engine's
  # write paths, and the Drizzle insert-select class that the mocked-`db` unit
  # tests are structurally blind to have none of them ever executed in CI.
  #
  # Two things this job does that are less obvious than they look:
  #
  #   1. It provisions schema. The dedicated CI Postgres on 127.0.0.1:55432 is
  #      an empty tmpfs instance -- db-guards.yml's migration-replay creates a
  #      throwaway database and drops it again, leaving nothing behind, and a
  #      container restart wipes it regardless. So the replay runs here too,
  #      with KEEP_TEST_DB=1, and the suites point at what it leaves.
  #
  #   2. It sets DATABASE_URL, not just TEST_DATABASE_URL. The suites import the
  #      real services, which import db/client.ts, which THROWS at module load
  #      when DATABASE_URL is unset. Setting only TEST_DATABASE_URL un-skips the
  #      blocks and then dies before the first assertion. Both must be set, and
  #      to the same scratch database, or the fixtures write to one database and
  #      assert against another. #1904's guard allowlists exactly
  #      127.0.0.1:55432, which this satisfies.
  #
  # The file list is explicit rather than a glob, and that is deliberate: a
  # whole-suite `bun test` with a database configured fails 54 tests, because
  # `mock.module('.../db/client', () => ({ db: {} }))` in the route smoke tests
  # leaks across files and hands the real-DB suites an empty `db`. Add files
  # here as they harden; the tail of that work is tracked on #1906.
  #
  # monster-attacks joined this list in T02 and passes 10/10. The 2 failures
  # this note used to attribute to a participant_type CHECK violation do not
  # reproduce at all; it had simply never been registered, so nothing noticed
  # it had become green.
  #
  # solo-survivability is the one suite still absent, and it is genuinely
  # blocked: 4 pass / 7 fail, re-measured (T02) on the pgvector/pgvector image
  # this job actually uses, reproduced across three fresh replays. That 7 is
  # unchanged from when this note was first written. They are ordinary
  # assertion mismatches -- death-save outcomes, an encounter that stays
  # `active` where the suite expects `completed`, and transcript text that no
  # longer matches /HIT for \d+ damage/ -- so it is a behaviour triage, per
  # case, on #1999. Not a harness problem.
  #
  # MEASURING THIS CORRECTLY REQUIRES pgvector. scripts/test-migrations.sh
  # SKIPS every migration mentioning `vector(` when the extension is absent,
  # and says so in a warning that is easy to scroll past. On a plain
  # postgres:16 that silently drops
  # supabase/migrations/20251205_create_lore_keeper_tables.sql, so
  # campaign_chunks comes out without its `embedding vector(768)` column, both
  # suites die on `column "embedding" ... does not exist`, and the result looks
  # exactly like schema drift. It is not -- #1999 was filed on that mistake and
  # withdrawn. Use pgvector/pgvector:pg16, and check the replay summary says
  # "pgvector available" before trusting any number from it.
  server-real-db:
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Check psql and the CI database are available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            echo "::error::psql not on PATH on the runner host. Install postgresql-client."
            exit 1
          fi
          if ! pg_isready -h 127.0.0.1 -p 55432 -U postgres; then
            echo "::error::CI PostgreSQL is not accepting connections on 127.0.0.1:55432."
            echo "On the runner host: docker start ci-postgres"
            echo "See docs/ci-self-hosted-runner.md."
            exit 1
          fi
      # Three installs, matching server-vitest plus the app workspace: the
      # suites import db/schema/*.ts, whose drizzle-orm resolves out of
      # ai-adventure-scribe-main/node_modules.
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: ai-adventure-scribe-main
      - run: bun install --frozen-lockfile
        working-directory: ai-adventure-scribe-main/server-bun
      - name: Replay migrations into a scratch database
        id: provision
        working-directory: ai-adventure-scribe-main
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55432/postgres
          KEEP_TEST_DB: '1'
        run: |
          set -o pipefail
          bash scripts/test-migrations.sh 2>&1 | tee /tmp/replay-$GITHUB_RUN_ID.log
          name="$(grep -o 'test_migrations_[0-9_]*' /tmp/replay-$GITHUB_RUN_ID.log | head -1)"
          if [ -z "$name" ]; then
            echo "::error::could not determine the scratch database name from the replay output."
            exit 1
          fi
          echo "db=$name" >> "$GITHUB_OUTPUT"
      - name: Run the real-database suites
        working-directory: ai-adventure-scribe-main/server-bun
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55432/${{ steps.provision.outputs.db }}
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55432/${{ steps.provision.outputs.db }}
        # The skip is the whole bug: a real-DB block whose database is missing
        # reports `0 fail` and exits 0. A job that can silently skip the tests
        # it exists to run is the thing #1906 is about, so assert out loud that
        # nothing skipped rather than trusting the exit code.
        run: |
          set -o pipefail
          bun test \
            src/services/__tests__/attack-telemetry.real-db.test.ts \
            src/services/__tests__/combat-hp-write-through.real-db.test.ts \
            src/services/__tests__/encounter-ending-reason.real-db.test.ts \
            src/services/__tests__/encounter-lifecycle.real-db.test.ts \
            src/services/__tests__/idle-encounter-sweeper.real-db.test.ts \
            src/services/__tests__/npc-turn-auto-advance.real-db.test.ts \
            src/services/__tests__/turn-cycle-tolerance.real-db.test.ts \
            src/services/__tests__/insert-select-writes-land.test.ts \
            src/services/__tests__/combat-damage-log-resilience.test.ts \
            src/services/__tests__/combat-initiative-modifier.real-db.test.ts \
            src/services/__tests__/combat-pending-intent.real-db.test.ts \
            src/services/__tests__/combat-intent-roster.real-db.test.ts \
            src/services/__tests__/combat-entry-transcript.real-db.test.ts \
            src/services/__tests__/combat-seat-player-name.real-db.test.ts \
            src/services/__tests__/companions.real-db.test.ts \
            src/services/__tests__/dm-reply-reconcile.real-db.test.ts \
            src/services/__tests__/issue-1784-public-table-rls.real-db.test.ts \
            src/services/__tests__/monster-attacks.real-db.test.ts \
            src/services/__tests__/player-exit-intent.real-db.test.ts \
            src/services/__tests__/session-initial-greeting.real-db.test.ts \
            src/services/__tests__/session-init-once.real-db.test.ts \
            src/services/__tests__/spell-slot-backfill.real-db.test.ts \
            2>&1 | tee "/tmp/real-db-$GITHUB_RUN_ID.log"
          if grep -qE '^ *[1-9][0-9]* skip' "/tmp/real-db-$GITHUB_RUN_ID.log"; then
            echo "::error::a real-database suite SKIPPED. The database env did not reach the tests."
            exit 1
          fi
          if ! grep -qE '^ *[1-9][0-9]* pass' "/tmp/real-db-$GITHUB_RUN_ID.log"; then
            echo "::error::no tests reported as passing -- the suites did not run."
            exit 1
          fi
      - name: Drop the scratch database
        if: always()
        run: |
          rm -f "/tmp/replay-$GITHUB_RUN_ID.log" "/tmp/real-db-$GITHUB_RUN_ID.log"
          db="${{ steps.provision.outputs.db }}"
          [ -n "$db" ] || exit 0
          PGPASSWORD=postgres psql -X -q -h 127.0.0.1 -p 55432 -U postgres -d postgres \
            -c "DROP DATABASE IF EXISTS \"$db\" WITH (FORCE);" || true

  # Keep the check visible and truthfully skipped until its test harness is
  # self-contained. The old job was never green: it expected an unconfigured
  # DATABASE_URL and WorkOS credentials, then hid every startup failure behind
  # continue-on-error. A missing check made that history invisible again.
  #
  # Re-enable only after both blockers are removed:
  #   1. provision a job-scoped throwaway Postgres (never the production DB);
  #   2. make the auth-role specs use a local test verifier instead of fetching
  #      WorkOS JWKS with repository credentials.
  #
  # The suite remains locally runnable with `bun run e2e`. See issue #1817.
  e2e:
    name: e2e (skipped — harness blocked by #1817)
    if: ${{ false }}
    runs-on: self-hosted
    steps:
      - name: Document the intentional skip
        run: echo "E2E is intentionally skipped; see issue #1817."
