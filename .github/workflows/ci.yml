name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: ai-adventure-scribe-main

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bunx tsc --noEmit
      - run: bunx vitest run
      - run: bun run build

  server-vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: ai-adventure-scribe-main/server-bun
      - run: bunx vitest run server-bun/src
