name: Release & Changelog

on:
  push:
    branches:
      - main
    paths:
      - "ai-adventure-scribe-main/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

defaults:
  run:
    working-directory: ai-adventure-scribe-main

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Create or update release PR
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout released tag
        if: ${{ steps.release.outputs['ai-adventure-scribe-main--release_created'] == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs['ai-adventure-scribe-main--tag_name'] }}

      - name: Post to blog
        if: ${{ steps.release.outputs['ai-adventure-scribe-main--release_created'] == 'true' }}
        env:
          BLOG_API_KEY: ${{ secrets.BLOG_API_KEY }}
          API_URL: ${{ vars.API_URL || 'https://api.infiniterealms.app' }}
        run: |
          RELEASE_TAG="${{ steps.release.outputs['ai-adventure-scribe-main--tag_name'] }}"
          VERSION="${RELEASE_TAG#v}"
          CHANGELOG_CONTENT=$(awk "/^## \[$VERSION\]/,/^## \[/{if(/^## \[/ && !/^## \[$VERSION\]/)exit; print}" CHANGELOG.md | tail -n +2)

          PAYLOAD=$(jq -n \
            --arg version "$VERSION" \
            --arg changelog "$CHANGELOG_CONTENT" \
            --arg commitHash "${{ github.sha }}" \
            '{version: $version, changelog: $changelog, commitHash: $commitHash}')

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${API_URL}/internal/release-post" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${BLOG_API_KEY}" \
            -d "$PAYLOAD")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Response: $BODY"
          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Blog post created successfully"
            echo "$BODY" | jq -r '.url // "URL not returned"'
          else
            echo "⚠️ Failed to create blog post (non-fatal)"
            echo "The release was successful, but the blog post could not be created."
            echo "This may be because the blog API is not yet configured."
          fi

      - name: Summary
        if: ${{ steps.release.outputs['ai-adventure-scribe-main--release_created'] == 'true' }}
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Release:** ${{ steps.release.outputs['ai-adventure-scribe-main--tag_name'] }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Changelog" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          RELEASE_TAG="${{ steps.release.outputs['ai-adventure-scribe-main--tag_name'] }}"
          VERSION="${RELEASE_TAG#v}"
          awk "/^## \[$VERSION\]/,/^## \[/{if(/^## \[/ && !/^## \[$VERSION\]/)exit; print}" CHANGELOG.md | tail -n +2 >> $GITHUB_STEP_SUMMARY
