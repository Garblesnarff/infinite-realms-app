<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose your hero</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&amp;family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&amp;family=Caveat:wght@500;700&amp;display=swap">
<style>
body{margin:0;background:#120a05}
a{color:#d5b070}a:hover{color:#f3deb0}
.tx-cinzel{font-family:'Cinzel',Georgia,serif}
.tx-hand{font-family:'Caveat','Segoe Print',cursive}
button:focus-visible,a:focus-visible{outline:2px solid #f3deb0;outline-offset:3px}
@keyframes flicker{0%,100%{opacity:.9;transform:scale(1)}18%{opacity:.72;transform:scale(.97)}37%{opacity:1;transform:scale(1.04)}55%{opacity:.8;transform:scale(.99)}78%{opacity:.95;transform:scale(1.02)}}
@keyframes flame2{0%,100%{transform:scale(1,1) skewX(0)}18%{transform:scale(.95,1.09) skewX(2.6deg)}42%{transform:scale(1.04,.94) skewX(-2.2deg)}66%{transform:scale(.98,1.05) skewX(1.4deg)}84%{transform:scale(1.02,.98) skewX(-.8deg)}}
@keyframes core2{0%,100%{opacity:.95;transform:scale(1)}33%{opacity:.8;transform:scale(.94,1.04)}66%{opacity:1;transform:scale(1.03,.97)}}
@keyframes halo{0%,100%{opacity:.85;transform:scale(1)}30%{opacity:.68;transform:scale(.95)}60%{opacity:1;transform:scale(1.05)}}
@keyframes sheen{0%{transform:translateX(-120%) skewX(-18deg)}100%{transform:translateX(220%) skewX(-18deg)}}
@keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.flicker{animation:flicker 3.2s ease-in-out infinite}
.flameG{transform-origin:50px 54px;animation:flame2 1.7s ease-in-out infinite}
.coreG{transform-origin:50px 50px;animation:core2 .9s ease-in-out infinite}
.haloG{transform-origin:50px 38px;animation:halo 2.9s ease-in-out infinite}
.rise{animation:rise .45s ease-out both}
.brass{background:linear-gradient(160deg,#f6e3b8 0%,#d5b070 38%,#a9823f 70%,#6e5226 100%);color:#1a1206;border:1px solid #f3deb0;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(0,0,0,.25),0 6px 14px rgba(0,0,0,.45)}
.brass:hover{filter:brightness(1.07);color:#1a1206}
.sheen{position:absolute;inset:0;overflow:hidden;border-radius:inherit;pointer-events:none}
.sheen::after{content:"";position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:sheen 3.6s ease-in-out infinite}
.hcard{cursor:pointer;border:0;padding:0;background:none;transition:transform .3s cubic-bezier(.2,.8,.2,1),filter .3s}
.hcard:hover{transform:translateY(-14px) rotate(0deg)!important}
.hcard.is-on{transform:translateY(-36px) rotate(0deg) scale(1.08)!important;z-index:3}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: linear-gradient(180deg, #3b2616 0%, #2b1a0e 52%, #1b1008 100%); font-family: 'EB Garamond', Georgia, serif; color: #eaeefa">
<svg width="0" height="0" style="position: absolute" aria-hidden="true">
<defs>
<filter id="woodgrain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.0022 0.085" numOctaves="4" seed="7"></feTurbulence><feColorMatrix type="matrix" values="0 0 0 0 0.10  0 0 0 0 0.055  0 0 0 0 0.025  1.35 0 0 0 -0.42"></feColorMatrix></filter>
<filter id="noise" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter>
<filter id="stain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="5" seed="4"></feTurbulence><feColorMatrix type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.27  0 0 0 0 0.10  0.95 0 0 0 -0.43"></feColorMatrix></filter>
<filter id="deckle" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="11" result="t"></feTurbulence><feDisplacementMap in="SourceGraphic" in2="t" scale="9" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap></filter>
<linearGradient id="cWax" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a28a62"></stop><stop offset=".22" stop-color="#e6d8b6"></stop><stop offset=".45" stop-color="#fff7e3"></stop><stop offset=".64" stop-color="#efe1c0"></stop><stop offset="1" stop-color="#937d56"></stop></linearGradient>
<linearGradient id="cWaxLit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffbe5a" stop-opacity=".55"></stop><stop offset=".45" stop-color="#ffbe5a" stop-opacity="0"></stop></linearGradient>
<radialGradient id="cPool" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff2cf"></stop><stop offset=".7" stop-color="#f3dfae"></stop><stop offset="1" stop-color="#cdb487"></stop></radialGradient>
<linearGradient id="cBrass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4a3418"></stop><stop offset=".28" stop-color="#b08a45"></stop><stop offset=".47" stop-color="#f6e3b8"></stop><stop offset=".62" stop-color="#c9a25e"></stop><stop offset="1" stop-color="#3f2c14"></stop></linearGradient>
<radialGradient id="cDish" cx=".42" cy=".3" r=".75"><stop offset="0" stop-color="#f6e3b8"></stop><stop offset=".5" stop-color="#b08a45"></stop><stop offset="1" stop-color="#3f2c14"></stop></radialGradient>
<radialGradient id="cHalo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd68c" stop-opacity=".8"></stop><stop offset=".35" stop-color="#ffaa50" stop-opacity=".3"></stop><stop offset="1" stop-color="#ff8c32" stop-opacity="0"></stop></radialGradient>
<radialGradient id="cFlame" cx=".5" cy=".8" r=".78"><stop offset="0" stop-color="#fffdf2"></stop><stop offset=".25" stop-color="#fff0b8"></stop><stop offset=".55" stop-color="#ffc05a"></stop><stop offset=".85" stop-color="#ff7a1f" stop-opacity=".7"></stop><stop offset="1" stop-color="#ff5a0a" stop-opacity="0"></stop></radialGradient>
<radialGradient id="cCore" cx=".5" cy=".72" r=".6"><stop offset="0" stop-color="#ffffff"></stop><stop offset=".6" stop-color="#fff6d8" stop-opacity=".9"></stop><stop offset="1" stop-color="#fff0b8" stop-opacity="0"></stop></radialGradient>
<radialGradient id="cBlue" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#6c8cff" stop-opacity=".9"></stop><stop offset="1" stop-color="#3a5bff" stop-opacity="0"></stop></radialGradient>
<filter id="cSoft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.1"></feGaussianBlur></filter>
<filter id="cBlur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3"></feGaussianBlur></filter>
<linearGradient id="clipMetal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6f747d"></stop><stop offset=".3" stop-color="#eef1f5"></stop><stop offset=".52" stop-color="#aeb3bc"></stop><stop offset=".78" stop-color="#f7f9fb"></stop><stop offset="1" stop-color="#7e838c"></stop></linearGradient>
</defs>
</svg>
<svg style="position: absolute; left: 0; top: 0; width: 1440px; height: 900px" viewBox="0 0 1440 900" preserveAspectRatio="none" aria-hidden="true"><rect width="1440" height="900" filter="url(#woodgrain)"></rect></svg>
<div style="position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 55%, transparent 40%, rgba(0,0,0,.55) 100%)"></div>
<div class="flicker" style="position: absolute; left: -256px; top: -318px; width: 700px; height: 700px; border-radius: 50%; background: radial-gradient(circle, rgba(255,186,96,.32) 0%, rgba(255,160,70,.13) 35%, transparent 68%); pointer-events: none"></div>
<svg style="position: absolute; left: 44px; top: -8px; width: 100px; height: 172px; overflow: visible" viewBox="0 0 100 172" aria-hidden="true">
<ellipse cx="58" cy="161" rx="48" ry="8" fill="rgba(0,0,0,.55)" filter="url(#cBlur)"></ellipse>
<path d="M86 150 c13 -1 16 -17 4 -20 c-7 -1.5 -10 3 -8 7.5" fill="none" stroke="url(#cBrass)" stroke-width="3.4" stroke-linecap="round"></path>
<ellipse cx="50" cy="152" rx="42" ry="10" fill="url(#cDish)"></ellipse>
<ellipse cx="50" cy="149" rx="38" ry="7.4" fill="#5a4020"></ellipse>
<ellipse cx="50" cy="148.4" rx="36" ry="6.4" fill="url(#cBrass)" opacity=".92"></ellipse>
<path d="M34 146 L36.5 131 H63.5 L66 146 Z" fill="url(#cBrass)"></path>
<ellipse cx="50" cy="131.2" rx="13.6" ry="3" fill="#7a5a28"></ellipse>
<path d="M37 132 V64 Q37 60 41 60 H59 Q63 60 63 64 V132 Z" fill="url(#cWax)"></path>
<path d="M37 64 V132 H63 V64 Z" fill="url(#cWaxLit)"></path>
<path d="M40.8 61 C 40 70 42 78 40.4 86 C 39.8 90.4 43.8 90.8 43.5 86 C 43 78 45.2 70 44.6 62 Z" fill="#f6ecd4"></path>
<path d="M56.2 61 C 57.2 66 55.6 71 57 76 C 57.6 79.2 60.4 78.8 59.8 75.2 C 59 70 60.6 66 59.6 61 Z" fill="#efe3c6"></path>
<ellipse cx="50" cy="61" rx="13" ry="3.4" fill="#f7eed8"></ellipse>
<ellipse cx="50" cy="61.3" rx="10" ry="2.3" fill="url(#cPool)"></ellipse>
<path d="M50 61 C 50 57 49.4 54 50.6 50" stroke="#1a1008" stroke-width="1.6" fill="none" stroke-linecap="round"></path>
<circle cx="50.7" cy="50" r="1.3" fill="#ff8a2a"></circle>
<g class="haloG"><circle cx="50" cy="38" r="36" fill="url(#cHalo)"></circle></g>
<g class="flameG">
<path d="M50 54.5 C 39.5 46 40.5 31 50 9 C 59.5 31 60.5 46 50 54.5 Z" fill="url(#cFlame)" filter="url(#cSoft)"></path>
<g class="coreG"><path d="M50 52.5 C 44.6 47 45 38 50 25.5 C 55 38 55.4 47 50 52.5 Z" fill="url(#cCore)"></path></g>
<ellipse cx="50" cy="50.6" rx="4.2" ry="3.2" fill="url(#cBlue)"></ellipse>
</g>
</svg>
<div style="position: absolute; left: 36px; top: 170px; width: 1368px; height: 706px; border-radius: 24px; background: radial-gradient(ellipse at 50% 38%, #172a52 0%, #0e1a36 55%, #070d1e 100%); box-shadow: 0 30px 60px rgba(0,0,0,.6), inset 0 0 90px rgba(0,0,0,.55), inset 0 0 0 2px rgba(0,0,0,.4)">
<svg style="position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 24px; opacity: .22; mix-blend-mode: overlay" preserveAspectRatio="none" aria-hidden="true"><rect width="100%" height="100%" filter="url(#noise)"></rect></svg>
<div style="position: absolute; inset: 12px; border-radius: 16px; border: 1.5px dashed rgba(213,176,112,.28)"></div>
</div>

<div style="position: absolute; left: 180px; top: 34px; right: 60px">
<nav aria-label="Steps" style="display: flex; gap: 14px; align-items: center"><span style="display: flex; align-items: center; gap: 6px; color: rgba(234,238,250,.62)"><span class="tx-cinzel" style="width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; border: 1px solid rgba(234,238,250,.4)">1</span><span class="tx-cinzel" style="font-size: 12px; letter-spacing: .14em; font-weight: 700">CAMPAIGN</span></span><span style="color: rgba(234,238,250,.4)">›</span><span style="display: flex; align-items: center; gap: 6px; color: #f3deb0"><span class="tx-cinzel" style="width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: linear-gradient(160deg,#f6e3b8,#a9823f); color: #1a1206">2</span><span class="tx-cinzel" style="font-size: 12px; letter-spacing: .14em; font-weight: 700">HERO</span></span><span style="color: rgba(234,238,250,.4)">›</span><span style="display: flex; align-items: center; gap: 6px; color: rgba(234,238,250,.62)"><span class="tx-cinzel" style="width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; border: 1px solid rgba(234,238,250,.4)">3</span><span class="tx-cinzel" style="font-size: 12px; letter-spacing: .14em; font-weight: 700">PLAY</span></span></nav>
<h1 class="tx-cinzel" style="margin: 10px 0 0; font-size: 40px; font-weight: 700; color: #f3deb0; line-height: 1.1">Choose your hero</h1>
<p style="margin: 6px 0 0; font-size: 18px; color: #f1e6cb">Abyssal Descent · <a href="Campaigns.dc.html" style="color: #d5b070">change campaign</a></p>
</div>

<div role="radiogroup" aria-label="Heroes" style="position: absolute; left: 70px; top: 330px; width: 920px; height: 420px; display: flex; justify-content: center; align-items: flex-end">
<sc-for list="{{heroes}}" as="h" hint-placeholder-count="5">
<button type="button" role="radio" aria-checked="{{h.checked}}" aria-label="{{h.name}}, {{h.klass}}" class="hcard {{h.cls}}" onClick="{{h.pick}}" style="position: relative; width: 206px; height: 206px; margin: 0 -14px; transform: translateY({{h.lift}}px) rotate({{h.rot}}deg); filter: drop-shadow(0 18px 22px rgba(0,0,0,.65))">
<img src="{{h.img}}" alt="" style="display: block; width: 100%; height: 100%; border-radius: 8px; box-shadow: 0 0 0 {{h.ringW}} {{h.ring}}">
</button>
</sc-for>
</div>

<div class="rise" style="position: absolute; left: 1024px; top: 214px; width: 350px; filter: drop-shadow(0 18px 22px rgba(0,0,0,.55))">
<div style="position: absolute; inset: 0; background: linear-gradient(175deg, #f2e7cd 0%, #e2cfa4 100%); filter: url(#deckle); border-radius: 4px"></div>
<svg style="position: absolute; inset: 0; width: 100%; height: 100%; mix-blend-mode: multiply; opacity: .8" preserveAspectRatio="none" aria-hidden="true"><rect width="100%" height="100%" filter="url(#stain)"></rect></svg>
<div style="position: relative; padding: 26px 26px 24px; color: #2a1a0c; display: flex; flex-direction: column; gap: 12px">
<div class="tx-cinzel" style="font-size: 11px; letter-spacing: .18em; color: #8b5a1f">YOUR HERO</div>
<div class="tx-cinzel" style="font-size: 32px; font-weight: 700; line-height: 1.05">{{name}}</div>
<div style="font-size: 17px; font-style: italic; color: #5b4630">{{klass}} · Level 1</div>
<sc-if value="{{simple}}" hint-placeholder-val="{{ true }}">
<span style="align-self: flex-start; padding: 3px 10px; border-radius: 5px; background: #1f3a6b; color: #f3deb0; font-family: 'Cinzel', serif; font-size: 11px; font-weight: 700; letter-spacing: .1em">GOOD FIRST HERO</span>
</sc-if>
<p style="margin: 0; font-size: 19px; line-height: 1.45">“{{tagline}}”</p>
<div style="border-top: 1px dashed rgba(107,77,39,.5); padding-top: 12px; display: flex; flex-direction: column; gap: 10px">
<a href="Explore.dc.html" class="brass" style="position: relative; display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 10px; text-decoration: none; font-family: 'Cinzel', serif; font-size: 16px; font-weight: 700; letter-spacing: .08em">PLAY AS {{nameCaps}}<span class="sheen"></span></a>
<div style="font-size: 15px; font-style: italic; color: #5b4630; text-align: center">You can read the full sheet after you start.</div>
</div>
</div>
</div>

<div style="position: absolute; left: 70px; top: 796px; width: 920px; text-align: center; font-size: 16px; font-style: italic; color: rgba(241,230,203,.8)">Five ready-made heroes. Tap a card to look at it.</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picked: 'the-veteran' }; }
  renderVals() {
    var self = this, p = this.state.picked;
    var H = [
      { id: 'the-scholar', name: 'The Scholar', klass: 'Human Wizard', tagline: 'Academic obsessed with forbidden knowledge', img: '/_blob/dd579e73f3758868b0769fecdbb63c91' },
      { id: 'the-hunter', name: 'The Hunter', klass: 'Human Ranger', tagline: 'Monster hunter with a personal code', img: '/_blob/cd1fef5765a3fce63a1d244f971142f0' },
      { id: 'the-veteran', name: 'The Veteran', klass: 'Human Fighter', tagline: 'Seasoned soldier haunted by past battles', img: '/_blob/08b960306328b6c2703f96dc5b709a48', simple: true },
      { id: 'the-pact-bound', name: 'The Pact-Bound', klass: 'Tiefling Warlock', tagline: 'Made deals for power, comfortable with darkness', img: '/_blob/0643943f462d182f22ead5c3b3f77322' },
      { id: 'the-exile', name: 'The Exile', klass: 'Elf Druid', tagline: 'Drow who rejected cruelty, at home in darkness', img: '/_blob/6f571bd5172d354c2955468c3a77a789' }
    ];
    var rot = [-10, -5, 0, 5, 10], lift = [26, 8, 0, 8, 26];
    var cur = H.filter(function (h) { return h.id === p; })[0];
    return {
      heroes: H.map(function (h, i) { var on = h.id === p; return { name: h.name, klass: h.klass, img: h.img, rot: rot[i], lift: lift[i], cls: on ? 'is-on' : '', checked: on ? 'true' : 'false',
        ring: on ? '#f3deb0' : 'transparent', ringW: on ? '3px' : '0px', pick: function () { self.setState({ picked: h.id }); } }; }),
      name: cur.name, nameCaps: cur.name.toUpperCase(), klass: cur.klass, tagline: cur.tagline, simple: !!cur.simple
    };
  }
}
</script>
</body>
</html>
