<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reload state</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&amp;family=DM+Sans:wght@400;500;700&amp;family=EB+Garamond:ital,wght@0,400;0,500;1,400&amp;display=swap">
<style>
body{margin:0;background:#070b14}
a{color:#d5b070}a:hover{color:#f3deb0}
[hidden]{display:none!important}
.tx-cinzel{font-family:'Cinzel',Georgia,serif}
.tx-gar{font-family:'EB Garamond',Georgia,serif}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #f3deb0;outline-offset:2px}
button{font-family:'DM Sans',system-ui,sans-serif}
.brass{background:linear-gradient(160deg,#f6e3b8 0%,#d5b070 38%,#a9823f 70%,#6e5226 100%);color:#1a1206;border:1px solid #f3deb0;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(0,0,0,.25),0 6px 14px rgba(0,0,0,.45);cursor:pointer}
.brass:hover{filter:brightness(1.07)}
.gbtn{cursor:pointer;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid rgba(213,176,112,.45);background:#0c1220;color:#eaeefa;font-size:15px;font-weight:700}
.gbtn:hover{border-color:#f3deb0}
.cast{cursor:pointer;min-width:84px;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid #d5b070;background:#121b30;color:#f3deb0;font-size:15px;font-weight:700}
.cast:hover{background:#1c2742}
.cast[aria-disabled="true"]{cursor:not-allowed;opacity:.5}
.scroll{overflow-y:auto;scrollbar-color:#3a4566 transparent}
@keyframes dots{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#d5b070;margin-left:5px;animation:dots 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
.bar{position:relative;height:6px;border-radius:3px;background:#1c2742;overflow:hidden}
.bar i{position:absolute;left:0;top:0;height:6px;width:40%;border-radius:3px;background:#d5b070;animation:slide 1.6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite}
@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.rise{animation:rise .35s ease-out both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.bar i{width:40%}}

h1:focus,main:focus{outline:none}
.hr{height:1px;background:rgba(213,176,112,.3)}

</style>
</helmet>
<div style="position:relative;width:1440px;height:1040px;overflow:hidden;background:#070b14;color:#eaeefa;font-family:'DM Sans',system-ui,sans-serif;line-height:1.4;padding:40px 80px;box-sizing:border-box"><div class="tx-cinzel" style="font-size:12px;letter-spacing:.16em;color:#4fb6c4">RELOAD STATE</div><h1 class="tx-cinzel" style="margin:8px 0 0;font-size:36px;color:#f3deb0">A reload shows the end screen, not the game</h1><p style="margin:10px 0 0;max-width:980px;font-size:17px;line-height:1.55;color:#d4dbef">The server already stores <b>vital_state = dead</b> for the character. The page reads that one value on load. Dead means the end screen. There is no overlay to dismiss and no toast.</p><div style="margin-top:26px;display:flex;gap:30px;align-items:flex-start"><figure style="margin:0;width:304px"><figcaption style="margin-bottom:12px"><div class="tx-cinzel" style="font-size:14px;font-weight:700;letter-spacing:.08em;color:#ef8a8a">TODAY · RELOAD</div><div style="margin-top:4px;font-size:15px;line-height:1.45;color:#d4dbef;min-height:110px">The game screen loads first. The composer is live. The Scholar looks alive. The death card shows only after the next message send, and a reload loses it.</div></figcaption><div style="width:304px;height:658px;overflow:hidden;border-radius:16px;box-shadow:0 0 0 2px rgba(239,138,138,.6),0 18px 40px rgba(0,0,0,.6)"><div style="width:390px;height:844px;transform:scale(.78);transform-origin:0 0"><dc-import name="FightPhone" moment="R3 Scholar" hint-size="390px,844px"></dc-import></div></div></figure><div aria-hidden="true" style="align-self:center;margin-top:60px;color:#d5b070"><svg width="36" height="36" viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div><figure style="margin:0;width:304px"><figcaption style="margin-bottom:12px"><div class="tx-cinzel" style="font-size:14px;font-weight:700;letter-spacing:.08em;color:#f3deb0">PROPOSED · 1. GATE</div><div style="margin-top:4px;font-size:15px;line-height:1.45;color:#d4dbef;min-height:110px">The page waits for the saved state. It shows the name and nothing else. The game screen and the composer never render.</div></figcaption><div style="width:304px;height:658px;overflow:hidden;border-radius:16px;box-shadow:0 0 0 2px rgba(213,176,112,.6),0 18px 40px rgba(0,0,0,.6)"><div style="width:390px;height:844px;transform:scale(.78);transform-origin:0 0"><dc-import name="DeathPhone" view="loading" hint-size="390px,844px"></dc-import></div></div></figure><div aria-hidden="true" style="align-self:center;margin-top:60px;color:#d5b070"><svg width="36" height="36" viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div><figure style="margin:0;width:304px"><figcaption style="margin-bottom:12px"><div class="tx-cinzel" style="font-size:14px;font-weight:700;letter-spacing:.08em;color:#f3deb0">PROPOSED · 2. END SCREEN</div><div style="margin-top:4px;font-size:15px;line-height:1.45;color:#d4dbef;min-height:110px">The same screen as the live death, restored. No fade. No “Dungeon Master is writing” line. Fields that did not load are hidden.</div></figcaption><div style="width:304px;height:658px;overflow:hidden;border-radius:16px;box-shadow:0 0 0 2px rgba(213,176,112,.6),0 18px 40px rgba(0,0,0,.6)"><div style="width:390px;height:844px;transform:scale(.78);transform-origin:0 0"><dc-import name="DeathPhone" view="end" phase="restored" hint-size="390px,844px"></dc-import></div></div></figure></div></div>
</x-dc>

</body>
</html>
