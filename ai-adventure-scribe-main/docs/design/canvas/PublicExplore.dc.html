<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Explore adventures</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&amp;family=DM+Sans:wght@400;500;700&amp;family=EB+Garamond:ital,wght@0,400;0,500;1,400&amp;display=swap">
<style>
body{margin:0;background:#070b14}
a{color:#d5b070}a:hover{color:#f3deb0}
.tx-cinzel{font-family:'Cinzel',Georgia,serif}
button:focus-visible,a:focus-visible{outline:2px solid #f3deb0;outline-offset:3px}
.pcard{transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.pcard:hover,.pcard:focus-visible{transform:translateY(-4px);box-shadow:0 0 0 2px #d5b070,0 22px 40px rgba(0,0,0,.55)!important}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #070b14; font-family: 'DM Sans', system-ui, sans-serif; color: #eaeefa">
<div style="position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 0%, rgba(79,182,196,.10) 0%, transparent 55%), radial-gradient(ellipse at 50% 100%, rgba(213,176,112,.06) 0%, transparent 50%)"></div>

<header style="position: absolute; left: 0; top: 0; width: 1440px; height: 72px; display: flex; align-items: center; justify-content: space-between; padding: 0 80px; box-sizing: border-box; border-bottom: 1px solid rgba(213,176,112,.18); background: #0a0f1c">
<a href="Landing.dc.html" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; color: #eaeefa; text-decoration: none; font-size: 16px">
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5M11 6l-6 6 6 6" fill="none" stroke="#d5b070" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>Back to home</a>
<a href="Landing.dc.html" aria-label="Infinite Realms, home" style="display: inline-flex; align-items: center; gap: 12px; text-decoration: none">
<svg width="34" height="34" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="16.5" fill="#0c1220" stroke="#4fb6c4" stroke-width="1.5"></circle><path d="M18 8 L20.2 15.8 L28 18 L20.2 20.2 L18 28 L15.8 20.2 L8 18 L15.8 15.8 Z" fill="#4fb6c4"></path></svg>
<span class="tx-cinzel" style="font-size: 20px; letter-spacing: .2em; color: #eaeefa">INFINITE <span style="color: #d5b070">REALMS</span></span></a>
</header>

<div style="position: absolute; left: 0; top: 112px; width: 1440px; text-align: center">
<h1 class="tx-cinzel" style="margin: 0; font-size: 54px; font-weight: 700; color: #f3deb0; letter-spacing: .02em">Explore adventures</h1>
<p style="margin: 14px auto 0; max-width: 640px; font-size: 18px; line-height: 1.6; color: #aab3cc">Ready-made campaigns for one player and an AI Dungeon Master. Pick one and play tonight.</p>
</div>

<div style="position: absolute; left: 80px; top: 296px; width: 1280px; display: flex; gap: 40px">
<sc-for list="{{camps}}" as="c" hint-placeholder-count="3">
<a href="PublicCampaign.dc.html" class="pcard" aria-label="{{c.aria}}" style="position: relative; display: block; width: 400px; height: 450px; border-radius: 16px; overflow: hidden; background: #0c1220; box-shadow: 0 0 0 1px rgba(213,176,112,.28), 0 14px 30px rgba(0,0,0,.45); text-decoration: none; color: #eaeefa">
<img src="{{c.img}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: {{c.pos}}">
<div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(7,11,20,.05) 0%, rgba(7,11,20,.5) 42%, #070b14 100%)"></div>
<div style="position: absolute; left: 16px; top: 16px; max-width: 262px; display: flex; gap: 6px; overflow: hidden; white-space: nowrap">
<sc-for list="{{c.tags}}" as="t" hint-placeholder-count="2"><span style="padding: 4px 10px; border-radius: 999px; background: #070b14; border: 1px solid rgba(234,238,250,.4); font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #eaeefa">{{t}}</span></sc-for>
</div>
<span style="position: absolute; right: 16px; top: 16px; padding: 4px 10px; border-radius: 999px; background: #070b14; border: 1px solid {{c.diffColor}}; color: {{c.diffColor}}; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase">{{c.diff}}</span>
<div style="position: absolute; left: 22px; right: 22px; bottom: 20px; display: flex; flex-direction: column; gap: 8px">
<div class="tx-cinzel" style="font-size: 28px; font-weight: 700; line-height: 1.12; color: #f3deb0; text-shadow: 0 2px 8px #000">{{c.title}}</div>
<p class="clamp3" style="margin: 0; font-size: 15px; line-height: 1.5; color: #d4dbef; height: 68px">{{c.hook}}</p>
<div style="height: 22px; display: flex; align-items: center; gap: 6px; font-size: 14px; color: #aab3cc">{{c.meta}}</div>
<span style="display: inline-flex; align-items: center; gap: 6px; min-height: 28px; font-size: 16px; font-weight: 700; color: #d5b070">Begin your journey<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="#d5b070" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
</div>
</a>
</sc-for>
</div>

<div style="position: absolute; left: 0; top: 786px; width: 1440px; text-align: center; font-size: 16px; color: #aab3cc">More adventures are on the way.</div>
<footer style="position: absolute; left: 0; top: 836px; width: 1440px; height: 64px; display: flex; align-items: center; justify-content: center; border-top: 1px solid rgba(213,176,112,.18); font-size: 14px; color: #8f9ab8">© 2026 InfiniteRealms. All rights reserved.</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var C = [
      { id: 'abyssal', title: 'Abyssal Descent', img: '/_blob/157200b9099918a34801b5fec34f74dd', pos: '50% 35%', tags: ['Horror', 'Survival'], diff: 'Hard', diffColor: '#ef8a8a',
        hook: 'The party joins an expedition to descend the Infinite Chasm, a vertical cave system that supposedly reaches the center of the earth.', meta: 'Level 1 · 10–15 sessions' },
      { id: 'academy', title: 'Academy of Arcane Gastronomy', img: '/_blob/187452b7fe34f3f89a710ce5fba6c0c0', pos: '82% 40%', tags: ['Fantasy'], diff: 'Medium', diffColor: '#f3deb0',
        hook: 'The Academy of Arcane Gastronomy is the most prestigious culinary school in the realm, where only the most talented young chefs are admitted.', meta: 'Level 1 · [sessions]' },
      { id: 'feast', title: 'The Eternal Feast', img: '/_blob/0082a22301a2497c67af37e00a58b96b', pos: '50% 40%', tags: ['Fantasy'], diff: 'Medium', diffColor: '#f3deb0',
        hook: 'The Eternal Feast is a legendary restaurant that exists between dimensions, reached from any world through hidden doorways.', meta: 'Level 1 · [sessions]' }
    ];
    return { camps: C.map(function (c) { return { title: c.title, img: c.img, pos: c.pos, tags: c.tags, diff: c.diff, diffColor: c.diffColor, hook: c.hook, meta: c.meta, aria: c.title + ', ' + c.diff + ' difficulty' }; }) };
  }
}
</script>
</body>
</html>
